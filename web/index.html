<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiFi Setup — ESP32 Device</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>ESP32 Device</h1>
  <nav>
    <a href="/">WiFi</a>
    <a href="/config">Config</a>
    <a href="/ota">OTA</a>
    <a href="/status">Status</a>
    <a href="/results">Results</a>
  </nav>
</header>

<div class="card">
  <h2>WiFi Setup</h2>
  <form id="wifi-form">
    <label for="ssid">Network Name (SSID)</label>
    <input type="text" id="ssid" name="ssid" placeholder="MyNetwork" autocomplete="off" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">

    <button type="submit">Save &amp; Connect</button>
  </form>
  <p id="status-msg"></p>
</div>

<div class="card">
  <h2>Saved Networks</h2>
  <p style="margin-bottom:0.75rem; font-size:0.85rem; color:var(--muted);">
    Tried in order on next boot/reconnect — most recently added first.
  </p>
  <div id="saved-networks"><p class="muted">Loading…</p></div>
</div>

<script src="/app.js"></script>
<script>
document.getElementById('wifi-form').addEventListener('submit', async e => {
  e.preventDefault();
  showStatus('Saving…', '');
  try {
    const res = await postJSON('/api/wifi', {
      ssid:     document.getElementById('ssid').value,
      password: document.getElementById('password').value,
    });
    showStatus(res.message || (res.ok ? 'Saved.' : 'Error.'), res.ok ? 'ok' : 'error');
  } catch (err) {
    showStatus('Request failed: ' + err.message, 'error');
  }
});

async function loadSavedNetworks() {
  const el = document.getElementById('saved-networks');
  try {
    const ssids = await (await fetch('/api/wifi/list')).json();
    if (!ssids.length) {
      el.innerHTML = '<p class="muted">No saved networks yet.</p>';
      return;
    }
    el.innerHTML = ssids.map((ssid, i) => `
      <div class="info-row">
        <span>${i === 0 ? '<strong>' + ssid + '</strong> (tried first)' : ssid}</span>
        <button type="button" class="danger" data-ssid="${ssid}">Delete</button>
      </div>
    `).join('');
    el.querySelectorAll('button[data-ssid]').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          await postJSON('/api/wifi/delete', { ssid: btn.dataset.ssid });
          loadSavedNetworks();
        } catch (err) {
          btn.disabled = false;
        }
      });
    });
  } catch (err) {
    el.innerHTML = '<p class="muted">Could not load saved networks.</p>';
  }
}

loadSavedNetworks();
</script>
</body>
</html>
